name: Tests de l'API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Installer les dependances
        run: python -m pip install -r requirements.txt

      - name: Executer les tests
        run: python -m pytest -q
        
        - name: Construire l'image Docker
        run: docker build -t application-tp:ci .

      - name: Demarrer le conteneur
        run: docker run -d --name api-test -p 8080:8000 application-tp:ci

      - name: Verifier la disponibilite de l'API
        run: |
          for tentative in {1..15}; do
            if curl --fail --silent --show-error --max-time 2 http://localhost:8080/health; then
              exit 0
            fi
            sleep 2
          done
          echo "L'API ne repond pas dans le delai prevu."
          exit 1

      - name: Afficher les journaux et nettoyer
        if: always()
        run: |
          docker logs api-test || true
          docker rm -f api-test || true